apiVersion: apps/v1
kind: Deployment
metadata:
  name: ota-server
  labels:
    app: ota-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ota-server
  template:
    metadata:
      labels:
        app: ota-server
    spec:
      containers:
        - name: ota-server
          image: ota-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          env:
            - name: DATABASE_URL
              value: "postgresql://otauser:otapassword123@ota-postgres:5432/ota_db"
            - name: PORT
              value: "5001"
---
apiVersion: v1
kind: Service
metadata:
  name: ota-server
spec:
  type: NodePort
  selector:
    app: ota-server
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30001